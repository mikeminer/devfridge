name: Investor Relations chat
on:
  pull_request:
    paths: ['ir/**', '.github/workflows/ir.yml']
  push:
    branches: [master]
    paths: ['ir/**', '.github/workflows/ir.yml']
permissions:
  contents: read
jobs:
  ir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ir/package-lock.json
      - run: npm ci --prefix ir
      - run: npm test --prefix ir
      - run: npm run build --prefix ir
