[package]
name = "fridge"
version = "0.1.0"
description = "Token-2022 time-lock vaults"
edition = "2021"

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = [
  'cfg(feature, values("anchor-debug", "custom-heap", "custom-panic"))',
  'cfg(target_os, values("solana"))',
]

[lib]
crate-type = ["cdylib", "lib"]
name = "fridge"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
# Devnet/testnet only: burn the 2% fee of the locked mint. Do not enable on mainnet
# (mainnet must Jupiter-buy and burn $PASTA).
test-cluster = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["token_2022"] }
solana-security-txt = "1.1.3"
# token (legacy SPL) is used to wrap SOL for featured-boost Jupiter buybacks.
