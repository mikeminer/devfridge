name: Security checks

on:
  push:
    paths:
      - "programs/**"
      - "Cargo.toml"
      - "Cargo.lock"
  pull_request:
    paths:
      - "programs/**"
      - "Cargo.toml"
      - "Cargo.lock"

jobs:
  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --manifest-path programs/fridge/Cargo.toml --lib -- -D warnings

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Known upstream advisories from Solana SDK transitive deps (not fixable
          # without an Anchor version bump). Tracked, not ignored:
          # - RUSTSEC-2024-0344: curve25519-dalek timing (Solana SDK dep)
          # - RUSTSEC-2022-0093: ed25519-dalek double-key (Solana SDK dep)
          ignore: RUSTSEC-2024-0344,RUSTSEC-2022-0093

  unit-tests:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --manifest-path programs/fridge/Cargo.toml --lib

  xray:
    name: Sec3 X-ray
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download X-ray
        run: |
          gh release download v0.0.6 --repo sec3-product/x-ray --pattern '*.tar.gz'
          tar xzf x-ray-*.tar.gz
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Run X-ray scan
        run: |
          chmod +x ./bin/xray
          ./bin/xray . | tee xray-report.txt
      - name: Upload report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xray-report
          path: xray-report.txt
