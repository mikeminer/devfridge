app = "devfridge-world-live"
primary_region = "iad"

[build]
  dockerfile = "world-live/Dockerfile"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = "1gb"
  cpus = 1
  cpu_kind = "shared"
